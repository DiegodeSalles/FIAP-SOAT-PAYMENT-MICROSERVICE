name: CI/CD Orders MS

on:
  pull_request:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fiap-fastfood-ms-payment
  EKS_CLUSTER_NAME: fiap-fastfood-eks

jobs:
  deploy:
    name: Build & Deploy to EKS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com

          docker build -t ${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_URI}/${ECR_REPOSITORY}:latest
          docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_URI}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push ${ECR_URI}/${ECR_REPOSITORY}:latest
          docker push ${ECR_URI}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${EKS_CLUSTER_NAME}

      - name: Deploy to Kubernetes
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_POS_ID: ${{ secrets.MP_POS_ID }}
          MP_BASE_URL: ${{ secrets.MP_BASE_URL }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
        run: |
          kubectl apply -f k8s/aws/namespace.yaml

          kubectl create secret generic payment-secret \
            --namespace fastfood \
            --from-literal=MP_ACCESS_TOKEN="$MP_ACCESS_TOKEN" \
            --from-literal=MP_POS_ID="$MP_POS_ID" \
            --from-literal=MP_BASE_URL="$MP_BASE_URL" \
            --from-literal=MONGODB_URL="$MONGODB_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/aws/configmap.yaml
          kubectl apply -f k8s/aws/payment-deployment.yaml
          kubectl apply -f k8s/aws/payment-service.yaml
