apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: fastfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: fiap-fastfood-ms-payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: MONGODB_URL
            - name: MONGODB_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: MONGODB_DB_NAME
            - name: MP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: MP_ACCESS_TOKEN
            - name: MP_POS_ID
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: MP_POS_ID
            - name: MP_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: MP_BASE_URL
          # readinessProbe:
          #   httpGet:
          #     path: /api/v1/payments/
          #     port: 8080
          #   initialDelaySeconds: 20
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /api/v1/payments/
          #     port: 8080
          #   initialDelaySeconds: 40
          #   periodSeconds: 20